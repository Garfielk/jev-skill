[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-skill"
version = "0.1.0"
description = "Practical Jev recipes, focused agent skills, and a dependency-free OpenRouter CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "wuyoscar"}]
dependencies = []

[project.urls]
Repository = "https://github.com/wuyoscar/jev-skill"
Issues = "https://github.com/wuyoscar/jev-skill/issues"

[project.scripts]
jev-decide = "jev:main"

[tool.setuptools]
py-modules = ["jev"]
package-dir = {"" = "skills/jev/scripts"}
